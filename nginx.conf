events {
    worker_connections 1024;
}

http {
    # HTTP to HTTPS Redirection
    server {
        listen 80;
        server_name pushtaklekhan.spmeshram.tech;
        return 301 https://$host$request_uri;
    }

    # HTTPS Reverse Proxy
    server {
        listen 443 ssl;
        server_name pushtaklekhan.spmeshram.tech;

        ssl_certificate /etc/letsencrypt/live/pushtaklekhan.spmeshram.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pushtaklekhan.spmeshram.tech/privkey.pem;

        # Backend API Proxy
        location /api/ {
            proxy_pass http://inkwell_backend:8000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Frontend Next.js Proxy
        location / {
            proxy_pass http://inkwell_frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}