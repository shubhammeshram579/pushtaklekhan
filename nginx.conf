events {
    worker_connections 1024;
}

http {
    # 1. Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name pushtaklekhan.spmeshram.tech;
        return 301 https://$host$request_uri;
    }

    # 2. Production HTTPS Server
    server {
        listen 443 ssl;
        server_name pushtaklekhan.spmeshram.tech;

        # SSL Certificates
        ssl_certificate /etc/letsencrypt/live/pushtaklekhan.spmeshram.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pushtaklekhan.spmeshram.tech/privkey.pem;

        # Route API requests to Express Backend
        location /api/ {
            proxy_pass http://inkwell_backend:8000;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Redirect root traffic to Vercel (or return 404 if Vercel uses custom domain directly)
        location / {
            # Option A: If using a Vercel URL for frontend
            return 301 https://pushtaklekhan.vercel.app$request_uri;

            # Option B: If Vercel manages pushtaklekhan.spmeshram.tech directly via CNAME, 
            # and EC2 handles api.spmeshram.tech, you can omit 'location /' entirely.
        }
    }
}