events {
    worker_connections 1024;
}

http {
    # 1. Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name pushtaklekhan.spmeshram.tech;
        return 301 https://$host$request_uri;
    }

    # 2. Production HTTPS Server
    server {
        listen 443 ssl;
        server_name pushtaklekhan.spmeshram.tech;

        # SSL Certificates
        ssl_certificate /etc/letsencrypt/live/pushtaklekhan.spmeshram.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pushtaklekhan.spmeshram.tech/privkey.pem;

        # Backend API Route
        location /api/ {
            proxy_pass http://inkwell_backend:8000;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Proxy Frontend Traffic directly to Vercel
        location / {
            proxy_pass https://pushtaklekhan.vercel.app;
            proxy_set_header Host pushtaklekhan.vercel.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Required for HTTPS proxying
            proxy_ssl_server_name on;
        }
    }
}