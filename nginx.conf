events {
    worker_connections 1024;
}

http {
    # 1. Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name pushtaklekhan.spmeshram.tech;
        return 301 https://$host$request_uri;
    }

    # 2. Production HTTPS Server
    server {
        listen 443 ssl;
        server_name pushtaklekhan.spmeshram.tech;

        # SSL Certificates
        ssl_certificate /etc/letsencrypt/live/pushtaklekhan.spmeshram.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pushtaklekhan.spmeshram.tech/privkey.pem;

        # Route API requests to Express Backend
        location /api/ {
            # Strips '/api' so /api/auth/register becomes /auth/register on Express
            # rewrite ^/api/(.*)$ /$1 break;
            
            # Points to your actual container name 'inkwell_backend'
            proxy_pass http://inkwell_backend:8000;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Route all other requests to Next.js Frontend
        location / {
            proxy_pass http://inkwell_frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}