name: Build Backend & Deploy to EC2

on:
  push:
    branches:
      - main  # Runs automatically on push to main branch

jobs:
  # JOB 1: Build Docker Image on GitHub Runners (Free RAM) and push to Docker Hub
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/inkwell-backend:latest

  # JOB 2: Trigger EC2 via SSH to Pull Image and Restart Container
  deploy-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/pushtaklekhan
            
            # 1. Fetch updated docker-compose or config files
            git reset --hard HEAD
            git pull origin main
            
            # 2. Pull pre-built backend image from Docker Hub
            docker compose pull backend
            
            # 3. Restart container with zero heavy build computation on EC2
            docker compose up -d backend
            
            # 4. Clean old unused image layers to save disk space
            docker image prune -f